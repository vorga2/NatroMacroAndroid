plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vorga.natromobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.vorga.natromobile'
        minSdk 30
        targetSdk 35
        versionCode 11
        versionName '0.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // CI signs the APK after build with the reproducible development key.
            signingConfig null
        }
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
}
