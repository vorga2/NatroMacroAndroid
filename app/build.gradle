plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vorga.natromobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.vorga.natromobile'
        minSdk 30
        targetSdk 35
        versionCode 8
        versionName '0.4.0'
    }

    buildTypes {
        debug {
            // CI signs the APK after build with the reproducible development key.
            signingConfig null
        }
    }
}
