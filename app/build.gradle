plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vorga.natromobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.vorga.natromobile'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
    }

    buildTypes {
        debug {
            // CI signs the APK after build with a reproducible development key.
            // This keeps the signing certificate stable between GitHub runners.
            signingConfig null
        }
    }
}
