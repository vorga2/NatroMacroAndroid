name: Android APK

on:
  push:
    branches: [ "main", "capture-on-demand" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natro-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDKROOT=$SDKROOT"
          SDKMANAGER=""
          for c in "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" "$SDKROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found, dumping SDK root:"
            ls -la "$SDKROOT" || true
            ls -la "$SDKROOT/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build unsigned debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Recreate stable development signing key
        run: python3 ci/generate_signing_key.py "$RUNNER_TEMP/natro-dev-key.pk8"

      - name: Sign APK with stable development certificate
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_DIR="app/build/outputs/apk/debug"
          if [ -f "$DEBUG_DIR/app-debug-unsigned.apk" ]; then
            UNSIGNED="$DEBUG_DIR/app-debug-unsigned.apk"
          else
            UNSIGNED="$DEBUG_DIR/app-debug.apk"
          fi
          SIGNED="$DEBUG_DIR/NatroMacroAndroid-v0.6.0-debug.apk"
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key "$RUNNER_TEMP/natro-dev-key.pk8" \
            --cert ci/natro-dev-cert.pem \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NatroMacroAndroid-v0.6.0-apk
          path: app/build/outputs/apk/debug/NatroMacroAndroid-v0.6.0-debug.apk
          if-no-files-found: error
